[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "aTrain_core"
description = "Transcription engine behind aTrain: faster-whisper transcription + pyannote speaker detection, usable headless via the aTrain_core CLI."
# Metadata kept minimal: this member is consumed via the workspace, not yet
# published standalone. Enrich (readme/license/classifiers) if/when it goes to PyPI.
authors = [
  { name = "Armin Haberl", email = "armin.haberl@uni-graz.at" },
  { name = "Jürgen Fleiß", email = "juergen.fleiss@uni-graz.at" },
  { name = "Dominik Kowald", email = "dkowald@know-center.at" },
  { name = "Stefan Thalmann", email = "stefan.thalmann@uni-graz.at" },
]
dynamic = ["version"]
requires-python = ">=3.11"

dependencies = [
  "faster-whisper==1.2.1",
  "pandas==2.3.3",
  "pyannote.audio==4.0.4",
  "numpy==2.2.2",
  "werkzeug==3.0.3",
  "huggingface-hub==0.30.2",
  "torch==2.9.1+cu130; sys_platform == 'win32'",
  "torch==2.9.1; sys_platform != 'win32'",
  # torchaudio must match torch (ABI-coupled); keep in lockstep with the pins above.
  "torchaudio==2.9.1+cu130; sys_platform == 'win32'",
  "torchaudio==2.9.1; sys_platform != 'win32'",
  "typer==0.16.0",
  "platformdirs==4.5.1",
  "jiwer==3.0.4",
]

[project.scripts]
aTrain_core = "aTrain_core.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["aTrain_core*"]

[tool.setuptools.package-data]
# Ship the engine's JSON config (models/languages/formats), loaded at runtime
# via importlib.resources.files("aTrain_core.data"). Without this the wheel
# omits them and a non-editable `pip install` breaks at startup.
aTrain_core = ["data/*.json"]

[tool.setuptools.dynamic]
version = { attr = "aTrain_core.version.__version__" }

[tool.uv.sources]
# torch+cu130 wheels (win32 only) come from the workspace pytorch-cu130 index
# defined in the root pyproject.toml.
torch       = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
torchaudio  = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
