name: atrain
title: aTrain
summary: Offline transcription of speech recordings
description: |
  aTrain is a tool for automatically transcribing speech recordings utilizing
  state-of-the-art machine learning models without uploading any data.
  It supports automatic speech-to-text transcription, speaker diarization, GPU
  acceleration with CUDA support, and export to multiple research formats.
version: "1.4.2"
license: MIT
contact: mailto:juergen.fleiss@uni-graz.at
website: https://github.com/JuergenFleiss/aTrain
issues: https://github.com/JuergenFleiss/aTrain/issues
source-code: https://github.com/JuergenFleiss/aTrain
donation: https://github.com/sponsors/JuergenFleiss
icon: atrain/share/icons/io.github.juergenfleiss.aTrain.svg
base: core24
confinement: strict

plugs:
  shared-memory:
    interface: shared-memory
    private: true

parts:
  atrain:
    plugin: python
    source: https://github.com/JuergenFleiss/aTrain.git
    source-commit: 202f075a8886a9babab802b0bfe19ea1ee727048
    python-packages:
      - pyqt5
      - pyqtwebengine
      - qtpy
      - nvidia-npp-cu12
    build-environment:
      - PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cu128
    build-packages:
      - git
      - build-essential
      - pkg-config
      - libcairo2-dev
      - libgirepository1.0-dev
    stage-packages:
      - libasound2t64
      - libegl1
      - libfontconfig1
      - libgl1
      - libglib2.0-0
      - libgirepository-1.0-1
      - libpulse-mainloop-glib0
      - libpulse0
      - libnss3
      - libx11-6
      - libx11-xcb1
      - libxcomposite1
      - libxdamage1
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-render-util0
      - libxcb-render0
      - libxcb-shape0
      - libxcb-xinerama0
      - libxfixes3
      - libxkbcommon-x11-0
      - libxrandr2
      - libxss1
      - libxtst6
      - libwayland-cursor0
      - dmz-cursor-theme
      - gir1.2-gtk-3.0
    override-build: |
      craftctl default

      # Copy wrapper script to bin directory
      mkdir -p $CRAFT_PART_INSTALL/bin
      cp $CRAFT_PROJECT_DIR/snapcraft_atrain_wrapper.sh $CRAFT_PART_INSTALL/bin/atrain_wrapper
      chmod +x $CRAFT_PART_INSTALL/bin/atrain_wrapper

      # Download required models using our dedicated script
      echo "Downloading required models..."
      python3 $CRAFT_PROJECT_DIR/snapcraft_download_models.py $CRAFT_PART_INSTALL

apps:
  atrain:
    command: bin/atrain_wrapper start --native
    common-id: io.github.juergenfleiss.aTrain
    plugs:
      - desktop
      - desktop-legacy
      - opengl
      - x11
      - wayland
      - network
      - network-bind
      - network-status
      - browser-support
      - home
      - removable-media
      - audio-playback
      - shared-memory
      - process-control

    environment:
      PATH: $SNAP/usr/bin:$SNAP/bin:$PATH
      PYTHONPATH: $SNAP/lib/python3.12/site-packages:$SNAP/usr/lib/python3/dist-packages:$SNAP/usr/lib/python3.12/dist-packages:$PYTHONPATH
      LD_LIBRARY_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$LD_LIBRARY_PATH
      ATRAIN_REQUIRED_MODELS_DIR: $SNAP/lib/python3.12/site-packages/aTrain/required_models
      TMPDIR: $SNAP_USER_COMMON/tmp
      XDG_RUNTIME_DIR: $SNAP_USER_COMMON/runtime
