[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "aTrain_core"
description = "aTrain_core is a command-line tool for automatically transcribing speech recordings utilizing state-of-the-art machine learning models without uploading any data."

authors = [
  { name = "Armin Haberl", email = "armin.haberl@uni-graz.at" },
  { name = "Jürgen Fleiß", email = "juergen.fleiss@uni-graz.at" },
  { name = "Dominik Kowald", email = "dkowald@know-center.at" },
  { name = "Stefan Thalmann", email = "stefan.thalmann@uni-graz.at" },
]

maintainers = [
  { name = "Armin Haberl", email = "armin.haberl@uni-graz.at" },
  { name = "Jürgen Fleiß", email = "juergen.fleiss@uni-graz.at" },
  { name = "Andrea Forster", email = "andrea.forster@uni-graz.at" },
]

dynamic = ["version"]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

dependencies = [
  "faster-whisper==1.2.1",
  "pandas==2.3.3",
  "pyannote.audio==4.0.4",
  "numpy==2.2.2",
  "werkzeug==3.0.3",
  "huggingface-hub==0.30.2",
  "torch==2.9.1+cu130; sys_platform == 'win32'",
  "torch==2.9.1; sys_platform != 'win32'",
  # torchaudio must match torch (ABI-coupled); keep in lockstep with the pins above.
  "torchaudio==2.9.1+cu130; sys_platform == 'win32'",
  "torchaudio==2.9.1; sys_platform != 'win32'",
  "typer==0.16.0",
  "platformdirs==4.5.1",
  "jiwer==3.0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aTrain_core*"]

[project.scripts]
aTrain_core = "aTrain_core.cli:cli"

[tool.setuptools.dynamic]
version = { attr = "aTrain_core.version.__version__" }
