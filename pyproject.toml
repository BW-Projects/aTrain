[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "aTrain"
description = "aTrain is a tool for automatically transcribing speech recordings utilizing state-of-the-art machine learning models without uploading any data."

authors = [
  { name = "Armin Haberl", email = "armin.haberl@uni-graz.at" },
  { name = "Jürgen Fleiß", email = "juergen.fleiss@uni-graz.at" },
  { name = "Dominik Kowald", email = "dkowald@know-center.at" },
  { name = "Stefan Thalmann", email = "stefan.thalmann@uni-graz.at" },
]

dynamic = ["version"]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

dependencies = [
  # Engine lives in the aTrain_core workspace member; the UI depends on it.
  "aTrain_core",
]

[project.optional-dependencies]
# Install with `pip install 'aTrain[gui]'` to use the GUI / desktop window.
# Without these, `aTrain start` fails with a clean error pointing here;
# headless CLI (`aTrain_core transcribe …`, `aTrain init`) works on the
# base install.
gui = [
  "nicegui==2.21.1",
  "pywebview==6.1",
  "pywebview[GTK]; sys_platform == 'linux'",
  "show-in-file-manager==1.1.4",
  "wakepy==0.7.2",
  "dask; sys_platform == 'linux'",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aTrain"]

[project.scripts]
aTrain = "aTrain.app:cli"

[tool.setuptools.dynamic]
version = { attr = "aTrain.version.__version__" }

[tool.uv.workspace]
members = ["aTrain_core"]

[tool.uv]
# torch+cu130 wheels live only on download.pytorch.org; PyPI rejects
# local-version tags (+...), so cross-index name collision is impossible.
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true  # only used when [tool.uv.sources] points at it (win32 torch+cu130). Without this, unsafe-best-match would also pull cu130 wheels on Linux, which break the torchcodec binary ABI.

[tool.uv.sources]
# aTrain_core resolves from the workspace (dev + lockfile), not PyPI.
aTrain_core = { workspace = true }
# torch+cu130 source pins live in aTrain_core/pyproject.toml (where torch is
# declared); the pytorch-cu130 index above is workspace-wide.

[dependency-groups]
dev = [
  "ruff>=0.15.0",
  "bandit[toml]>=1.9.0",
  "pip-audit>=2.10.0",
]

[tool.bandit]
# CI runs `bandit -r aTrain aTrain_core`; these excludes keep ad-hoc local
# runs from descending into build/venv/model dirs.
exclude_dirs = [".venv", "build", "dist", "aTrain.egg-info", "aTrain_core.egg-info", "aTrain/required_models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# NiceGUI's `user` fixture (UI E2E) is async; auto mode lets pytest-asyncio
# handle async tests/fixtures without per-item markers.
asyncio_mode = "auto"
