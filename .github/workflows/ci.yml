name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

# Cancel in-progress runs on the same branch when a new push lands,
# except on the protected branches where every commit should produce a record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          # New uv.lock invalidates the cache automatically.
          cache-dependency-glob: "uv.lock"

      - name: Install ruff
        # Lint needs only ruff, not the app runtime. --locked still checks
        # uv.lock against pyproject.toml.
        run: uv sync --locked --only-group dev --no-install-project

      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

  security:
    name: bandit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install bandit
        # bandit scans source only, so the app runtime isn't needed.
        run: uv sync --locked --only-group dev --no-install-project

      - name: Bandit security scan
        run: uv run --no-sync bandit -r aTrain -c pyproject.toml

  dependencies:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install pip-audit
        run: uv sync --locked --only-group dev --no-install-project

      - name: Audit locked dependencies for known CVEs
        # Non-gating for now: nicegui 2.21.1 / werkzeug 3.0.3 carry known CVEs
        # pending the coordinated upgrade in #159. Flip to gating once that
        # lands. The findings still print on every run for visibility.
        continue-on-error: true
        # Export the lock as a PEP 751 pylock.toml and audit it via --locked.
        # pip-audit checks each pinned package against the PyPI advisory DB and
        # self-documents anything it can't audit (the git aTrain_core dep, the
        # +cuXXX torch builds from the PyTorch index) in a "Skip Reason" table —
        # no manual filtering, no app-runtime build.
        run: |
          mkdir -p /tmp/audit
          uv export --format pylock.toml -o /tmp/audit/pylock.toml
          uv run --no-sync pip-audit /tmp/audit --locked

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install unit-test deps (no torch, no GTK)
        # The unit tests cover only torch- and NiceGUI-free helpers
        # (aTrain/utils/archive.py), so we skip the heavy app runtime entirely.
        # aTrain_core is installed with --no-deps (we need only
        # aTrain_core.globals, which imports just platformdirs), plus the few
        # light libraries archive.py imports, plus pytest. Stays in seconds.
        run: |
          uv venv
          uv pip install --no-deps \
            "aTrain_core @ git+https://github.com/JuergenFleiss/aTrain_core.git@develop"
          uv pip install platformdirs pyyaml show-in-file-manager pytest

      - name: Run unit tests
        run: .venv/bin/python -m pytest tests/unit -v
