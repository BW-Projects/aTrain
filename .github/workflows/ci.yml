name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

# Cancel in-progress runs on the same branch when a new push lands,
# except on the protected branches where every commit should produce a record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          # New uv.lock invalidates the cache automatically.
          cache-dependency-glob: "uv.lock"

      - name: Install ruff
        # Lint needs only ruff, not the app runtime. --locked still checks
        # uv.lock against pyproject.toml.
        run: uv sync --locked --only-group dev --no-install-project

      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

  security:
    name: bandit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install bandit
        # bandit scans source only, so the app runtime isn't needed.
        run: uv sync --locked --only-group dev --no-install-project

      - name: Bandit security scan
        run: uv run --no-sync bandit -r aTrain -c pyproject.toml

  dependencies:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install pip-audit
        run: uv sync --locked --only-group dev --no-install-project

      - name: Audit locked dependencies for known CVEs
        # Non-gating for now: nicegui 2.21.1 / werkzeug 3.0.3 carry known CVEs
        # pending the coordinated upgrade in #159. Flip to gating once that
        # lands. The findings still print on every run for visibility.
        continue-on-error: true
        # pip-audit checks the PyPI advisory DB. We export the locked graph and
        # drop the entries PyPI cannot audit anyway — the git aTrain_core dep
        # and the +cuXXX torch builds from the PyTorch index — then audit the
        # rest (nicegui, werkzeug, starlette, … i.e. everything advisory-tracked).
        run: |
          uv export --format requirements-txt --no-emit-project --no-hashes \
            | grep -vE '@ git\+|\+cu[0-9]' > /tmp/audit-requirements.txt
          uv run --no-sync pip-audit -r /tmp/audit-requirements.txt --no-deps
